# NOTE: local mirror. The GitHub App used for pushes has no `workflows`
# permission, so this file must be added via the GitHub web UI:
# Add file -> Create new file -> .github/workflows/build.yml -> paste contents.
name: Build DevxyzShield APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK 36
        # android-actions/setup-android@v3 is BROKEN on current runners: its
        # sdkmanager --licenses step crashes on cmdline-tools 16.0 with
        # "Failed to find package 'tools'" (Runs #1 and #2, SDK step only).
        # The ubuntu runner already has a preinstalled SDK; install only the
        # components this app needs (SDK 36 only — android-37 does not exist).
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Make gradlew executable
        # API text pushes preserve no file modes, so gradlew arrives non-executable;
        # keep this so ./gradlew does not fail with Permission denied once
        # the SDK step passes.
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DevxyzShield-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
