# NOTE: local mirror. The GitHub App used for pushes has no `workflows`
# permission, so this file must be added via the GitHub web UI:
# Add file -> Create new file -> .github/workflows/build.yml -> paste contents.
name: Build DevxyzShield APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        # API text pushes preserve no file modes, so gradlew arrives non-executable;
        # without this, ./gradlew fails with Permission denied (Run #1, 16s).
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DevxyzShield-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
