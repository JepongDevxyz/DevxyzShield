org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
# NOTE: the original gradle.properties set -Djavax.net.ssl.trustStoreType=WINDOWS-ROOT
# (a Windows-only truststore). On Linux CI runners that breaks SSL context
# initialization, so HTTPS plugin downloads fail and AGP 8.9.3 appears "not found".
# Removed 2026-10-25 for DevxyzShield; the default JDK truststore is used instead.
org.gradle.parallel=true
org.gradle.caching=true
# Use a locally installed JDK 17 or 21; avoid machine-specific Java paths.
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
